<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Anti-Distractor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      width: 250px;
      padding: 14px;
      margin: 0;
      background: #f8fafc;
      color: #1e293b;
    }
    h1 {
      font-size: 14px;
      font-weight: 700;
      margin: 0 0 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .badge {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #94a3b8;
    }
    .badge.connected { background: #22c55e; }
    .badge.disconnected { background: #ef4444; }
    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px;
      font-size: 12px;
      line-height: 1.5;
    }
    .label {
      color: #64748b;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .val {
      font-weight: 600;
      margin-bottom: 6px;
    }
  </style>
</head>
<body>
  <h1><span id="badge" class="badge"></span> Anti-Distractor Sensor</h1>
  <div class="card">
    <div class="label">Local Bridge</div>
    <div id="conn-status" class="val">Connecting...</div>
    <div class="label">Session Status</div>
    <div id="session-status" class="val">-</div>
    <div class="label">Active Goal</div>
    <div id="goal-status" class="val">-</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
